#
# omokoda-mesh-os pacman.conf — standard Arch config, used only at build time
# by mkarchiso (not shipped as-is into the image; archiso substitutes its own
# mirror handling for the live environment).
#
[options]
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
