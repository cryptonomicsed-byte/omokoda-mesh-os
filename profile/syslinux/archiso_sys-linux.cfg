LABEL arch
TEXT HELP
Boot the omokoda-mesh-os gateway node on BIOS.
It allows you to install Arch Linux or perform system maintenance.
ENDTEXT
MENU LABEL omokoda-mesh-os gateway node (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the omokoda-mesh-os gateway node on BIOS with speakup screen reader.
It allows you to install Arch Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL omokoda-mesh-os gateway node (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
